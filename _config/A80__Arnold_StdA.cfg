################################## Identify Render Application ################################## 
Name= Arnold
Version=3
Version_Minor=0
TYPEv9=Archive

ExeCopyFromDir = <rrSharedExeDir>
ExeCopyToDir   = <rrLocalExeDir>
ExeCopiedWin=  <rrLocalExeDir>Arnold-*\bin\kick.exe
ExeCopiedLx=  <rrLocalExeDir>Arnold-*\bin\kick


##################################   [Windows] [Linux] [Osx] ##################################

CommandLine=<envFileExecute <rrEnvFile>> 

CommandLine=<rrEnvLine>

CommandLine=
	<SetEnvGlobal>

CommandLine=
	<CPU <LimitCPUs> <CPU>>

CommandLine=
	<SetEnvSoft>

CommandLine=
	<ResetExitCode> 

CommandLine=  
	::win  @echo 
	::lx   /bin/echo
	::osx  /bin/echo
	"*************** Rendering frame <FN> ***************"

CommandLine=  "<Exe>"
	<CPU -t <CPU> >
	-i "<Scene>"
    <CustomStaticAss -i "<CustomStaticAss>">
	<COSingleRenderProduct -o "<ImageDir><ImageFilename><FNimgPadded><ImageExtension>" >
	-l "<rrBaseAppPath>/bin"
	-dw
	-dp
	-nstdin
    -set options.abort_on_license_fail true
	::win  -nocrashpopup
    <verboseLevel>
    <renderQuality>
	<AdditionalCommandlineParam>
	<ClientConfigParam>

CommandLine=
	<CheckExitCode> <FN>

CommandLine=  
	::win  @echo 
	::lx   /bin/echo
	::osx  /bin/echo
	"*************** Frame <FN> done ***************"
    
CommandLine=	"<rrBin64>rrKillWait" 1 ADSSO -this -withoutParent
CommandLine=	"<rrBin64>rrKillWait" 1 ADSKIDENTITYMANAGER -this -withoutParent
CommandLine=	"<rrBin64>rrKillWait" 1 ADSKLICENSINGAGENT -this -withoutParent
CommandLine=	"<rrBin64>rrKillWait" 1 ADPCLIENTSERVICE -this -withoutParent   
    

################################## Render Settings ################################## 


::include(A80__Arnold_StdA__global.inc)

::include(A00__Archive_global.inc)
::include(<ConfigFileName>__inhouse.inc)

